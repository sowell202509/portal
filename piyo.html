<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピヨ教授の不養生更生施設</title>
    <style>
        :root { 
            --main-gold: #cba55f; 
            --bright-yellow: #ffd700; 
            --bg-black: #0a0a0a; 
            --text-cream: #fdf5e6; 
        }
        
        body { 
            margin: 0; padding: 0; 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; 
            background-color: var(--bg-black); 
            color: var(--text-cream); 
            line-height: 1.8; 
            letter-spacing: 0.05em; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 700px; margin: 0 auto; padding: 0 24px; }
        
        section { padding: clamp(60px, 12vh, 120px) 0; text-align: center; }
        img { max-width: 100%; height: auto; margin-bottom: 40px; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2)); }

        span.keep { display: inline-block; }

        h1, h2 { 
            background: linear-gradient(70deg, #8c6a2c, #ffd700, #fdf5e6, #ffd700, #8c6a2c); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            font-weight: 900; line-height: 1.3; margin: 0 0 20px;
            text-wrap: balance;
        }
        h1 { font-size: clamp(2rem, 8vw, 3.2rem); }
        h2 { font-size: clamp(1.5rem, 6vw, 2.4rem); }

        p { font-size: 1rem; opacity: 0.9; margin: 0; }
        .highlight { color: var(--bright-yellow); font-weight: bold; }

        /* メソッドグリッド：不具合修正版 */
        .method-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            margin: 40px 0; 
        }
        .method-item { 
            background: #161616; 
            padding: 25px 10px; 
            border-radius: 12px; 
            border: 1px solid #333;
            flex: 1 1 calc(50% - 6px); /* 横並び */
            box-sizing: border-box;
        }
        /* 3つ目のカード（睡眠）を独立させて安定させる */
        .method-item.full { 
            flex: 1 1 100%; 
            margin-top: 4px;
        }

        .method-label { font-size: 0.75rem; color: var(--main-gold); display: block; margin-bottom: 8px; font-weight: bold; }
        .method-text { font-size: clamp(1rem, 4vw, 1.1rem); font-weight: bold; display: block; }

        /* 進化エリア：カードとの衝突を避けるためのマージン */
        .evolution-box { 
            margin-top: 40px; 
            padding: 80px 0 180px; 
            border-top: 1px solid #222; 
        }

        /* CTAボタン */
        .cta-outer { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            padding: 40px 0 30px; z-index: 1000; text-align: center; 
            background: linear-gradient(to top, rgba(10,10,10,1) 60%, rgba(10,10,10,0));
        }
        .btn-note { 
            display: inline-block; 
            background: linear-gradient(45deg, #8c6a2c, #ffd700, #8c6a2c); 
            color: #000; 
            text-decoration: none; 
            padding: 18px 60px; 
            border-radius: 100px; 
            font-weight: 900; 
            font-size: 1.1rem; 
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }

        footer { font-size: 0.75rem; opacity: 0.4; margin-top: 40px; }
        .back { color: var(--main-gold); text-decoration: none; font-size: 0.85rem; display: block; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <section>
            <img src="img/piyo_hero.png" alt="王座">
            <h1>努力は、毒だ。</h1>
            <p>
                <span class="keep">まだ無駄な足掻きを</span><span class="keep">続けるのか？</span><br>
                <span class="keep">僕様が教えるのは、</span><span class="keep">最短の</span><span class="highlight keep">「ズボラ養生」</span><span class="keep">のみだ。</span>
            </p>
        </section>

        <section>
            <h2>頑張るから、壊れる。</h2>
            <img src="img/piyo_laugh.png" alt="嘲笑" style="max-width: 280px;">
            <p>
                <span class="keep">三日坊主、</span><span class="keep">サプリ漬け、</span><span class="keep">睡眠不足。</span><br>
                <span class="keep">そんな拷問はもうやめろ。</span><br>
                <span class="highlight keep">「もっと、ズボラでいい。」</span>
            </p>
        </section>

        <section>
            <h2>怠惰こそが、正解。</h2>
            <img src="img/piyo_bed.png" alt="講義">
            <div class="method-grid">
                <div class="method-item">
                    <span class="method-label">食事</span>
                    <span class="method-text">工夫して、食え。</span>
                </div>
                <div class="method-item">
                    <span class="method-label">運動</span>
                    <span class="method-text">寝ながら、整えろ。</span>
                </div>
                <div class="method-item full">
                    <span class="method-label">睡眠</span>
                    <span class="method-text">まず、スマホを捨てろ。</span>
                </div>
            </div>
        </section>

        <section class="evolution-box">
            <h2>進化を、目撃せよ。</h2>
            <img src="img/piyo_evolution.png" alt="進化" style="max-width: 240px;">
            <p>
                <span class="keep">Noteが10記事</span><span class="keep">更新されるたびに、</span><br>
                <span class="keep">僕様の衣装は</span><span class="highlight keep">豪華（ラグジュアリー）</span><span class="keep">に変わる。</span>
            </p>
            
            <a href="index.html" class="back">← ポータルサイトへ戻る</a>
            
            <footer><p>© 2025 GOLDEN PIYO PROFESSOR</p></footer>
        </section>
    </div>

    <div class="cta-outer">
        <a href="https://note.com/piyokyouju/n/nc5aae1943e08" class="btn-note">
            真理を学ぶ
        </a>
    </div>
</body>
</html>
