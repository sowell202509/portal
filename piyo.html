<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ピヨ教授の不養生更生施設 | 黄金の養生学</title>
    <style>
        :root { 
            --main-gold: #cba55f; 
            --bright-yellow: #ffd700; 
            --bg-black: #0a0a0a; 
            --text-cream: #fdf5e6; 
        }
        
        body { 
            margin: 0; padding: 0; 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; 
            background-color: var(--bg-black); 
            color: var(--text-cream); 
            line-height: 1.6; 
            letter-spacing: 0.05em; 
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 700px; margin: 0 auto; padding: 0 20px; }
        
        /* スマホでは余白を詰め、PCでは広げる動的設定 */
        section { padding: clamp(40px, 10vh, 100px) 0; text-align: center; }

        img { 
            max-width: 100%; height: auto; 
            margin-bottom: 30px; 
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.2)); 
        }

        /* 黄金グラデーションタイトル */
        h1, h2 { 
            background: linear-gradient(70deg, #8c6a2c, #ffd700, #fdf5e6, #ffd700, #8c6a2c); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            font-weight: 900; line-height: 1.2; margin: 0 0 20px;
        }
        h1 { font-size: clamp(1.8rem, 8vw, 3rem); }
        h2 { font-size: clamp(1.4rem, 6vw, 2.2rem); }

        p { font-size: 0.95rem; opacity: 0.95; margin: 0; line-height: 1.8; }
        .highlight { color: var(--bright-yellow); font-weight: bold; }

        /* メソッド：グリッドの最適化 */
        .method-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: clamp(10px, 3vw, 20px); 
            margin-top: 40px; 
        }
        .method-item { 
            background: #161616; 
            padding: 20px 10px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }
        .method-label { font-size: 0.7rem; color: var(--main-gold); display: block; margin-bottom: 8px; opacity: 0.8; }
        .method-text { font-size: 1rem; font-weight: bold; letter-spacing: 0; }

        /* 進化エリア：下部にボタン用の大きな余白 */
        .evolution-box { 
            margin-top: 60px; 
            padding: 60px 0 160px; /* ボタンと被らないための余白 */
            border-top: 1px solid #222; 
        }

        /* 黄金のフローティングボタン */
        .cta-outer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            padding: 30px 0 25px; 
            z-index: 1000; 
            text-align: center;
            background: linear-gradient(to top, rgba(10,10,10,1) 60%, rgba(10,10,10,0));
        }
        .btn-note { 
            display: inline-block; 
            background: linear-gradient(45deg, #8c6a2c, #ffd700, #8c6a2c); 
            color: #000; 
            text-decoration: none; 
            padding: 16px 50px; 
            border-radius: 100px; 
            font-weight: 900; 
            font-size: 1.1rem; 
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-note:active { transform: scale(0.95); }

        footer { font-size: 0.7rem; opacity: 0.4; margin-top: 40px; }
        .back { color: var(--main-gold); text-decoration: none; font-size: 0.8rem; display: block; margin-top: 30px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <section>
            <img src="img/piyo_hero.png" alt="王座に座るピヨ教授">
            <h1>努力は、毒だ。</h1>
            <p>まだ無駄な足掻きを続けるのか？<br>僕様が教えるのは、最短の<span class="highlight">「ズボラ養生」</span>のみだ。</p>
        </section>

        <section>
            <h2>頑張るから、壊れる。</h2>
            <img src="img/piyo_laugh.png" alt="嘲笑うピヨ教授" style="max-width: 280px;">
            <p>三日坊主、サプリ漬け、睡眠不足。<br>そんな拷問はもうやめろ。<span class="highlight">「もっと、ズボラでいい。」</span></p>
        </section>

        <section>
            <h2>怠惰こそが、正解。</h2>
            <img src="img/piyo_bed.png" alt="寝ながら講義するピヨ教授">
            <div class="method-grid">
                <div class="method-item">
                    <span class="method-label">食事</span>
                    <span class="method-text">工夫して、食え。</span>
                </div>
                <div class="method-item">
                    <span class="method-label">運動</span>
                    <span class="method-text">寝ながら、整えろ。</span>
                </div>
                <div class="method-item" style="grid-column: span 2;">
                    <span class="method-label">睡眠</span>
                    <span class="method-text">まず、スマホを捨てろ。</span>
                </div>
            </div>
        </section>

        <section class="evolution-box">
            <h2>進化を、目撃せよ。</h2>
            <img src="img/piyo_evolution.png" alt="ピヨ教授進化図" style="max-width: 240px;">
            <p>Noteが10記事更新されるたびに、<br>僕様の衣装は<span class="highlight">豪華（ラグジュアリー）</span>に変わる。</p>
            
            <a href="index.html" class="back">← ポータルサイトへ戻る</a>
            
            <footer><p>© 2025 GOLDEN PIYO PROFESSOR</p></footer>
        </section>
    </div>

    <div class="cta-outer">
        <a href="https://note.com/piyokyouju/n/nc5aae1943e08" class="btn-note">
            Noteで真理を学ぶ
        </a>
    </div>
</body>
</html>
